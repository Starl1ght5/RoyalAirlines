name: royal_airlines

description: Royal Airlines - Proyecto universitario Flutter.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  http: ^1.2.2
  flutter_secure_storage: ^11.0.0
  fl_chart: ^1.2.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0B1D3A"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B1D3A"
  image: "assets/images/logo.png"
  android_12:
    image: "assets/images/app_icon_foreground.png"
    icon_background_color: "#0B1D3A"
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/