spring.config.import=optional:file:.env[.properties]
spring.application.name=royal-airlines

server.port=${PORT:8080}

spring.mongodb.uri=${DB_URI}
spring.mongodb.database=${DB_DATABASE}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_SECRET}

# Redireccion tras el login web con Google (la app movil usa POST /api/v1/auth/google).
app.frontend.oauth-success-url=${FRONTEND_OAUTH_SUCCESS_URL:https://royalairlines.netlify.app/oauth-success}
app.frontend.oauth-failure-url=${FRONTEND_OAUTH_FAILURE_URL:https://royalairlines.netlify.app/login?error=google}

# Origenes CORS permitidos, separados por coma (solo afecta a clientes web).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://royalairlines.netlify.app}

jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=60

royal.internal-api-key=${INTERNAL_API_KEY:}

royal.recommender-url=${RECOMMENDER_URL:}

royal.push.enabled=${PUSH_ENABLED:false}
royal.push.firebase-credentials=${FIREBASE_CREDENTIALS_PATH:}
royal.push.match-threshold=0.6
royal.push.max-per-user-per-day=2

spring.data.mongodb.auto-index-creation=true
spring.servlet.encoding.force=true
