spring.application.name=royal-airlines

spring.mongodb.uri=${DB_URI}
spring.mongodb.database=${DB_DATABASE}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_SECRET}

app.frontend.oauth-success-url=https://royalairlines.netlify.app/oauth-success
app.frontend.oauth-failure-url=https://royalairlines.netlify.app/login?error=google

jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=30

spring.data.mongodb.auto-index-creation=true
spring.servlet.encoding.force=true